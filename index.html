<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词根闯关 · 给初中生的单词冒险</title>
<link rel="stylesheet" href="css/quest.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><span class="logo">词</span><b>词根闯关</b></a>
  <nav><a href="#" data-go="map" class="on">地图</a><a href="#" data-go="wrong">错词本 <i id="wrongN">0</i></a><a href="roots.html">词根库</a></nav>
</header>
<main id="app">
  <section id="v-map" class="view">
    <div class="hero">
      <div>
        <p class="kicker">每天 5 个词根 · 10 分钟</p>
        <h1>拆开一个词根，<br>认识一串单词。</h1>
        <p class="sub">按「前缀 → 核心词根 → 后缀」三站闯关。每关先学 5 个词根，再玩两个热身小游戏，最后做小测，答对 80% 解锁下一关。</p>
      </div>
      <div class="stats">
        <div class="stat fire"><span id="streak">0</span><small>连续打卡（天）</small></div>
        <div class="stat"><span id="stars">0</span><small>获得星星</small></div>
        <div class="stat"><span id="cleared">0</span><small>已通关</small></div>
        <div class="week" id="week"></div>
      </div>
    </div>
    <div id="stages"></div>
  </section>

  <section id="v-learn" class="view hidden">
    <div class="bar"><button class="ghost" data-go="map">← 地图</button><div class="prog"><i id="lp"></i></div><span id="lcount"></span></div>
    <div id="card" class="card"></div>
    <div class="actions"><button class="ghost" id="prev">上一个</button><button class="primary" id="next">下一个</button></div>
  </section>

  <section id="v-play" class="view hidden">
    <div class="bar"><button class="ghost" data-go="map">← 地图</button><div class="prog"><i id="pp"></i></div><span id="pcount"></span></div>
    <div id="play" class="card play"></div>
  </section>

  <section id="v-quiz" class="view hidden">
    <div class="bar"><button class="ghost" data-go="map">← 退出</button><div class="prog"><i id="qp"></i></div><span id="qcount"></span></div>
    <div id="q" class="card quiz"></div>
  </section>

  <section id="v-result" class="view hidden"><div class="card result" id="result"></div></section>

  <section id="v-wrong" class="view hidden">
    <div class="bar"><button class="ghost" data-go="map">← 地图</button><h2>错词本</h2><span></span></div>
    <p class="sub">做错的词会自动收进来。复习时连续答对 2 次，就会被移出错词本。</p>
    <div id="wlist"></div>
    <div class="actions"><button class="primary" id="wreview">开始复习</button></div>
  </section>
</main>
<footer class="foot">基于 <a href="https://github.com/joeseesun/word-root-workshop" target="_blank" rel="noopener">word-root-workshop</a>（MIT，作者 乔帮主）改造 · 学习数据只保存在你的浏览器里</footer>
<script src="js/wordData.js"></script>
<script src="js/quest.js"></script>
</body>
</html>
